services:
  app:
    build: .
    image: ${IMAGEN:-gestor-tareas-app:local}
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - interna
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      start_period: 25s
      interval: 10s
      timeout: 3s
      retries: 8

  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-tareas.sql:ro
    networks:
      - interna
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pendientes -d pendientes"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  interna:

volumes:
  datos_postgres:
