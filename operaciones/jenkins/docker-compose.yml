services:
  motor:
    image: docker:27-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--host=tcp://0.0.0.0:2375", "--tls=false"]
    networks:
      - red_jenkins

  controlador:
    build: ./controlador
    ports:
      - "8888:8080"
    environment:
      DOCKER_HOST: tcp://motor:2375
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Xmx768m"
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
    volumes:
      - datos_controlador:/var/jenkins_home
    depends_on:
      - motor
    networks:
      - red_jenkins

networks:
  red_jenkins:
    name: red_jenkins_semana5

volumes:
  datos_controlador:
